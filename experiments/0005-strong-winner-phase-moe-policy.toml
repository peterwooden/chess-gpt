[experiment]
id = "0005-strong-winner-phase-moe-policy"
status = "completed_and_published"
question = "Does training only on moves made by decisive-game winners rated at least 1600 make the phase-MoE policy stronger than model 0003?"
hypothesis = "Removing moves by losing players and winners rated below 1600 concentrates the fixed compute budget on stronger move choices."
intentional_change = "Relative to model 0003, change only training-data selection: require a decisive result and winner ELO >= 1600, then retain only positions where the winner is to move. The losing player's ELO is unrestricted."

[prediction]
direction = "Model 0005 will be stronger than model 0003 in paired play."
magnitude = "Model 0005 wins 80 of 100 paired-match games against model 0003."
assumptions = "Players below ELO 1600 would not generate useful data for modelling chess at the lower end."
confidence = "40%"
failure_modes = "The filtered model plays very poorly against poor players."

[dataset]
manifest = "data/dataset.toml"
prepared_format = "board-snapshot-winner-v1"
train_months = ["2026-01"]
validation_months = ["2026-04"]
split_unit = "calendar-month"
game_result_filter = "1-0 or 0-1"
minimum_winner_elo = 1600
loser_elo_filter = "none"
target_side = "winner only"
max_selected_train_games = 120000
max_selected_validation_games = 5000
train_path = "data/downloads/tournament-2026/prepared/board-snapshot-winner-elo1600-v1/2026-01.parquet"
validation_path = "data/downloads/tournament-2026/prepared/board-snapshot-winner-elo1600-v1/2026-04.parquet"

[model]
architecture = "phase_moe"
router = "deterministic visible-board phase"
