[experiment]
id = "0003-phase-moe-policy"
status = "planned"
eligibility = "tournament candidate; publication requires all acceptance checks"
question = "At matched data and optimizer budget, does explicit phase specialization beat the shared board-snapshot policy?"
hypothesis = "The learner predicts that opening, middlegame, and endgame positions benefit from separate modes of thinking, so hard-routed phase experts should improve chess-level metrics over model 0002."
intentional_change = "Replace model 0002's one post-encoder expert with three deterministic opening, middlegame, and endgame experts; keep every other data and training setting fixed."

[prediction]
direction = "Improve over model 0002 by specializing parameters for opening, middlegame, and endgame positions."
magnitude = "pending learner prediction before material training"
assumptions = "pending learner prediction before material training"
confidence = "pending learner prediction before material training"
failure_modes = "pending learner prediction before material training"

[dataset]
manifest = "data/dataset.toml"
prepared_format = "board-snapshot-v1"
train_months = ["2026-01", "2026-02", "2026-03"]
validation_months = ["2026-04"]
max_games_per_train_month = 750000
max_validation_games = 100000
split_unit = "calendar-month"

[model]
architecture = "phase_moe"
router = "deterministic visible-board phase"
experts = ["opening", "middlegame", "endgame"]
d_model = 384
layers = 8
heads = 8
ff_multiplier = 4
dropout = 0.1
move_classes = 4272
legal_move_mask_at_inference = true
parameter_count = 19486128

[training]
epochs = 1
batch_size = 2048
learning_rate = 0.0003
weight_decay = 0.01
seed = 20260729
training_flop_limit = 1000000000000000000
profiled_flops_per_position = 5707579392
compute_accounting = "provisional chess-gpt-dense-training-v1; tournament ratification pending"
prior_lineage_flops = 0

[reproducibility]
command = "uv run chess-gpt-snapshot-train --train data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-01.parquet --train data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-02.parquet --train data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-03.parquet --validation data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-04.parquet --output runs/0003-phase-moe-policy --experiment-id 0003-phase-moe-policy --architecture phase_moe --d-model 384 --layers 8 --heads 8 --ff-multiplier 4 --dropout 0.1 --epochs 1 --batch-size 2048 --learning-rate 0.0003 --weight-decay 0.01 --seed 20260729"

[acceptance]
requires_tiny_smoke_run = true
requires_training_flops_at_most = 1000000000000000000
requires_package_bytes_at_most = 100000000
required_validation_legal_move_rate = 1.0
requires_paired_match_evaluation = true
requires_public_hugging_face_package = true
requires_shared_profiler_ratification = true
requires_complete_learner_prediction = true
requires_linked_lineage_evidence = true
