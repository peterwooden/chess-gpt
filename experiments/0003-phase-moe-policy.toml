[experiment]
id = "0003-phase-moe-policy"
status = "planned"
eligibility = "tournament candidate; publication requires all acceptance checks"
question = "Can a laptop-trained, approximately 50 MB phase-specialized policy produce an eligible tournament package within a three-hour safety limit?"
hypothesis = "The learner predicts that opening, middlegame, and endgame positions benefit from separate modes of thinking, making this phase-routed model a strong tournament candidate."
intentional_change = "Create the first laptop-scale phase-routed tournament candidate; this feasibility run is not a causal comparison with model 0002."

[prediction]
direction = "Improve over model 0002 by specializing parameters for opening, middlegame, and endgame positions."
magnitude = "In a future comparison trained on matched data, optimizer settings, processed positions, and FLOPs, Model 0003 wins 70% of head-to-head games against a size-matched Model 1."
assumptions = "The shared encoder represents board state information efficiently enough for phase-specific experts to act on it."
confidence = "70%"
failure_modes = "The deterministic opening/middlegame/endgame router behaves incorrectly or inconsistently at tournament inference time."

[dataset]
manifest = "data/dataset.toml"
prepared_format = "board-snapshot-v1"
train_months = ["2026-01"]
validation_months = ["2026-04"]
max_games_per_train_month = 100000
max_validation_games = 2000
split_unit = "calendar-month"

[model]
architecture = "phase_moe"
router = "deterministic visible-board phase"
experts = ["opening", "middlegame", "endgame"]
d_model = 336
layers = 6
heads = 8
ff_multiplier = 4
dropout = 0.1
move_classes = 4272
legal_move_mask_at_inference = true
parameter_count = 12397296
decoder = "4,272 move logits from a linear policy head; the adapter masks illegal moves, applies argmax, and converts the selected move to exact SAN; softmax probabilities are available but unnecessary for deterministic argmax"
target_canonical_package_bytes = 50000000
measured_untrained_size_probe_bytes = 49841097

[training]
epochs = 1
batch_size = 128
learning_rate = 0.0003
weight_decay = 0.01
seed = 20260729
training_flop_limit = 1000000000000000000
profiled_flops_per_position = 3297200256
compute_accounting = "ratified by all tournament competitors: chess-gpt-dense-training-v1"
prior_lineage_flops = 0
max_training_hours = 3.0
max_updates = 26650
max_training_positions = 3411200
loss_log = "runs/0003-phase-moe-policy/losses.jsonl"
live_chart_command = "uv run chess-gpt-snapshot-monitor --run runs/0003-phase-moe-policy"

[calibration]
status = "discarded; excluded from submission lineage"
device = "Apple MPS"
method = "Two warm-up updates followed by five timed synthetic updates per batch size."
batch_128_positions_per_second = 316.03
batch_128_driver_memory_mb = 4423.73
batch_256_positions_per_second = 306.95
batch_256_driver_memory_mb = 6581.70
batch_512_positions_per_second = 296.01
batch_512_driver_memory_mb = 8782.66
decision = "Use batch 128 because it had the highest measured throughput and the most laptop memory headroom."
estimated_updates_in_three_hours = 26665
fixed_update_ceiling = 26650

[reproducibility]
command = "uv run chess-gpt-snapshot-train --train data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-01.parquet --validation data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-04.parquet --output runs/0003-phase-moe-policy --experiment-id 0003-phase-moe-policy --architecture phase_moe --d-model 336 --layers 6 --heads 8 --ff-multiplier 4 --dropout 0.1 --epochs 1 --batch-size 128 --learning-rate 0.0003 --weight-decay 0.01 --seed 20260729 --device mps --max-hours 3 --max-updates 26650 --log-every-updates 1"

[acceptance]
requires_tiny_smoke_run = true
requires_training_flops_at_most = 1000000000000000000
requires_package_bytes_at_most = 100000000
required_validation_legal_move_rate = 1.0
requires_paired_match_evaluation = true
requires_public_hugging_face_package = true
requires_shared_profiler_ratification = true
requires_complete_learner_prediction = true
requires_linked_lineage_evidence = true
