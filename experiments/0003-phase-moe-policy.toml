[experiment]
id = "0003-phase-moe-policy"
status = "completed_and_published"
eligibility = "tournament-rule eligible package; local paired validation match tied 50-50"
question = "Can a laptop-trained, approximately 50 MB phase-specialized policy produce an eligible tournament package within a three-hour safety limit?"
hypothesis = "The learner predicts that opening, middlegame, and endgame positions benefit from separate modes of thinking, making this phase-routed model a strong tournament candidate."
intentional_change = "Create the first laptop-scale phase-routed tournament candidate; this feasibility run is not a causal comparison with model 0002."

[prediction]
direction = "Improve over model 0002 by specializing parameters for opening, middlegame, and endgame positions."
magnitude = "In a future comparison trained on matched data, optimizer settings, processed positions, and FLOPs, Model 0003 wins 70% of head-to-head games against a size-matched Model 1."
assumptions = "The shared encoder represents board state information efficiently enough for phase-specific experts to act on it."
confidence = "70%"
failure_modes = "The deterministic opening/middlegame/endgame router behaves incorrectly or inconsistently at tournament inference time."

