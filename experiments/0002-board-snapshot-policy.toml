[experiment]
id = "0002-board-snapshot-policy"
status = "completed_and_published"
eligibility = "tournament-rule eligible package; Model 1's qualitative learner prediction did not include a separate numeric confidence or failure mode"
question = "Can a laptop-trained board-snapshot policy produce an eligible tournament package within a three-hour safety limit?"
hypothesis = "The learner predicts that a board snapshot removes the network's need to replay a long history internally, simplifying next-move computation most in later positions."
intentional_change = "Create the first laptop-scale board-snapshot tournament candidate; the matched phase-MoE run adds only phase embeddings and three routed experts."

[prediction]
direction = "Improve next-move strength relative to a history-input model, with the largest benefit at later plies."
magnitude = "The learner did not assign a numeric Model 1 versus history-input effect; the stated prediction is qualitatively largest late in games."
assumptions = "The board snapshot is a more information-efficient representation for choosing the next move than replaying the SAN history inside the network."
confidence = "Not separately quantified by the learner; the 70% confidence prediction applies specifically to Model 2 beating Model 1."
failure_modes = "Not separately predicted by the learner for Model 1 before material training."

[dataset]
manifest = "data/dataset.toml"
prepared_format = "board-snapshot-v1"
train_months = ["2026-01"]
validation_months = ["2026-04"]
max_games_per_train_month = 100000
max_validation_games = 2000
split_unit = "calendar-month"

[model]
architecture = "snapshot"
d_model = 336
layers = 6
heads = 8
ff_multiplier = 4
dropout = 0.1
move_classes = 4272
legal_move_mask_at_inference = true
parameter_count = 10586256
decoder = "4,272 move logits from a linear policy head; the adapter masks illegal moves, applies argmax, and converts the selected move to exact SAN"
