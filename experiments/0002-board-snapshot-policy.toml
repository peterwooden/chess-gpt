[experiment]
id = "0002-board-snapshot-policy"
status = "planned"
eligibility = "tournament candidate; publication requires all acceptance checks"
question = "Does replacing SAN history with the current rule-complete board snapshot improve next-move strength, especially late in games?"
hypothesis = "The learner predicts that a board snapshot removes the network's need to replay a long history internally, simplifying next-move computation most in later positions."
intentional_change = "Encode the current board and rule state, then predict a stable UCI move class; SAN exists only at the arena adapter seam."

[dataset]
manifest = "data/dataset.toml"
prepared_format = "board-snapshot-v1"
train_months = ["2026-01", "2026-02", "2026-03"]
validation_months = ["2026-04"]
max_games_per_train_month = 750000
max_validation_games = 100000
split_unit = "calendar-month"

[model]
architecture = "snapshot"
d_model = 384
layers = 8
heads = 8
ff_multiplier = 4
dropout = 0.1
move_classes = 4272
legal_move_mask_at_inference = true
parameter_count = 17121456

[training]
epochs = 1
batch_size = 256
learning_rate = 0.0003
weight_decay = 0.01
seed = 20260729
training_flop_limit = 1000000000000000000
profiled_flops_per_position = 5693423616

[reproducibility]
command = "uv run chess-gpt-snapshot-train --train data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-01.parquet --train data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-02.parquet --train data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-03.parquet --validation data/downloads/tournament-2026/prepared/board-snapshot-v1/2026-04.parquet --output runs/0002-board-snapshot-policy --experiment-id 0002-board-snapshot-policy --architecture snapshot --d-model 384 --layers 8 --heads 8 --ff-multiplier 4 --dropout 0.1 --epochs 1 --batch-size 256 --learning-rate 0.0003 --weight-decay 0.01 --seed 20260729"

[acceptance]
requires_tiny_smoke_run = true
requires_training_flops_at_most = 1000000000000000000
requires_package_bytes_at_most = 100000000
required_validation_legal_move_rate = 1.0
requires_paired_match_evaluation = true
requires_public_hugging_face_package = true
